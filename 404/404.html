<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Blockchain at Emory</title>
    <link rel="stylesheet" href="404.css">
    <link rel="icon" type="image/png" href="../Images/Logo/Logo_Official.png">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-background">
        <canvas id="geometricCanvas" class="background-canvas"></canvas>
    </div>

    <!-- Navigation -->
    <nav class="home-navbar" id="homeNavbar">
        <div class="nav-container">
            <!-- Logo -->
            <div class="nav-logo">
                <a href="../Home/home.html" class="logo-link" aria-label="Blockchain at Emory - Home">
                    <img src="../Images/Logo/Logo_Official.png" alt="Blockchain at Emory" class="nav-logo-img">
                </a>
            </div>
            
            <!-- Navigation Links -->
            <nav class="nav-navigation" aria-label="Main navigation">
                <div class="nav-links-center">
                    <a href="../Home/home.html" class="nav-link">Home</a>
    
                    <a href="../Projects/projects.html" class="nav-link">Projects</a>
                    <a href="../Research/research.html" class="nav-link">Research</a>
                    <a href="../Finances/finances.html" class="nav-link">Finances</a>
                    <a href="../Team/Team.html" class="nav-link">Team</a>
                </div>
                <div class="nav-links-right">
                    <a href="../Home/home.html#contact" class="nav-link">Contact</a>
                    <a href="../Home/home.html#contact" class="nav-link nav-link-apply">Apply</a>
                </div>
            </nav>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="error-container">
            <!-- 404 Error Code -->
            <div class="error-code">
                <span class="error-number">4</span>
                <div class="error-divider"></div>
                <span class="error-number">04</span>
            </div>
            
            <!-- Error Title -->
            <h1 class="error-title">Page Not Found</h1>
            
            <!-- Error Message -->
            <p class="error-message">
                An error occurred while trying to reach this page
            </p>
            <p class="error-submessage">
                Please go back to the homepage
            </p>
            
            <!-- Back to Homepage Button -->
            <a href="../Home/home.html" class="back-button">Back to Homepage</a>
        </div>
    </main>

    <script src="404.js"></script>
</body>
</html>
